name: publish

on:
  push:
    tags:
      - v*

jobs:
  publish-pypi:
    name: pypi
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.15'
      - run: uv sync --only-group publish
      - run: uv run -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
