name: actions

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group coverage
      - run: git clone https://github.com/mbdevpl/argunparse ../argunparse
      - run: git clone https://github.com/mbdevpl/transpyle ../transpyle
      - run: git clone https://github.com/mbdevpl/typed-astunparse ../typed-astunparse
      - run: uv run -m coverage run --branch --source . -m unittest -v
      - run: uv run -m coverage report --show-missing
      - run: uv run -m codecov --token ${{ secrets.CODECOV_TOKEN }}
