name: actions

on:
  push:
  pull_request:
    branches:
      - $default-branch

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group coverage
      - run: git clone https://github.com/mbdevpl/argunparse ../argunparse
      - run: git clone https://github.com/mbdevpl/transpyle ../transpyle
      - run: git clone https://github.com/mbdevpl/typed-astunparse ../typed-astunparse
      - run: uv run -m coverage run --branch --source . -m unittest -v
      - run: uv run -m coverage report --show-missing
      - run: uv run -m codecov --token ${{ secrets.CODECOV_TOKEN }}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.14'
      - run: uv sync --only-group publish
      - run: uv run -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
